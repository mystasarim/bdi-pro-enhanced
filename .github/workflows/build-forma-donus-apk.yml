name: Build Formiva APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/formiva-models/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-forma-donus-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/formiva-models/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-forma-donus-apk.yml'
      - '.github/FORMIVA_BUILD_VALIDATION.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare real model assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode assets/formiva-models/male_coach.webp.b64 > app/src/main/res/drawable-nodpi/male_coach.webp
          base64 --decode assets/formiva-models/female_coach.webp.b64 > app/src/main/res/drawable-nodpi/female_coach.webp
          base64 --decode assets/formiva-models/male_exercise.webp.b64 > app/src/main/res/drawable-nodpi/male_exercise.webp
          base64 --decode assets/formiva-models/female_exercise.webp.b64 > app/src/main/res/drawable-nodpi/female_exercise.webp
          test -s app/src/main/res/drawable-nodpi/male_coach.webp
          test -s app/src/main/res/drawable-nodpi/female_coach.webp
          test -s app/src/main/res/drawable-nodpi/male_exercise.webp
          test -s app/src/main/res/drawable-nodpi/female_exercise.webp
          file app/src/main/res/drawable-nodpi/*.webp

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and rename APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Formiva-MYS-Design-v1.2.0-real-models.apk
          sha256sum Formiva-MYS-Design-v1.2.0-real-models.apk > Formiva-MYS-Design-v1.2.0-real-models-SHA256.txt

      - name: Upload Formiva APK
        uses: actions/upload-artifact@v4
        with:
          name: Formiva-MYS-Design-Real-Models-APK
          path: |
            Formiva-MYS-Design-v1.2.0-real-models.apk
            Formiva-MYS-Design-v1.2.0-real-models-SHA256.txt
          retention-days: 30
          if-no-files-found: error
