name: Build Formiva APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-forma-donus-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and rename APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Formiva-MYS-Design-v1.1.0-test.apk
          sha256sum Formiva-MYS-Design-v1.1.0-test.apk > Formiva-MYS-Design-v1.1.0-test-SHA256.txt

      - name: Upload Formiva APK
        uses: actions/upload-artifact@v4
        with:
          name: Formiva-MYS-Design-APK
          path: |
            Formiva-MYS-Design-v1.1.0-test.apk
            Formiva-MYS-Design-v1.1.0-test-SHA256.txt
          retention-days: 30
          if-no-files-found: error