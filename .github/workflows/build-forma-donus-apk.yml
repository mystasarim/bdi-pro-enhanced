name: Build Forma Donus APK
on:
  push:
    branches: [forma-donus-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Forma-Donus-MYS-Design-v1.0.0-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Forma-Donus-MYS-Design-APK
          path: Forma-Donus-MYS-Design-v1.0.0-test.apk
          retention-days: 30
